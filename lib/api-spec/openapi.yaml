openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ORIONIS AI Security Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summary endpoints
  - name: assets
    description: Asset management
  - name: vulnerabilities
    description: Vulnerability management
  - name: threats
    description: Threat detection and management
  - name: incidents
    description: Incident response management
  - name: ai
    description: AI agent operations
  - name: workflows
    description: Workflow management
  - name: compliance
    description: Compliance management
  - name: reports
    description: Report generation
  - name: audit
    description: Audit log operations
  - name: system
    description: System operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Dashboard ───────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get security dashboard summary
      responses:
        "200":
          description: Dashboard summary data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent security activity feed
      responses:
        "200":
          description: Recent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ─── Assets ──────────────────────────────────────────────────
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List all assets
      parameters:
        - name: type
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: criticality
          in: query
          schema: { type: number }
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Create a new asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  /assets/stats:
    get:
      operationId: getAssetStats
      tags: [assets]
      summary: Get asset statistics breakdown
      responses:
        "200":
          description: Asset stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetStats"

  /assets/{id}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get asset by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Not found
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update an asset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetPatch"
      responses:
        "200":
          description: Updated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Delete an asset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  # ─── Vulnerabilities ────────────────────────────────────────
  /vulnerabilities:
    get:
      operationId: listVulnerabilities
      tags: [vulnerabilities]
      summary: List vulnerabilities
      parameters:
        - name: severity
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: assetId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of vulnerabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vulnerability"
    post:
      operationId: createVulnerability
      tags: [vulnerabilities]
      summary: Create a vulnerability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VulnerabilityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vulnerability"

  /vulnerabilities/stats:
    get:
      operationId: getVulnerabilityStats
      tags: [vulnerabilities]
      summary: Get vulnerability statistics
      responses:
        "200":
          description: Vulnerability stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VulnerabilityStats"

  /vulnerabilities/{id}:
    get:
      operationId: getVulnerability
      tags: [vulnerabilities]
      summary: Get vulnerability by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Vulnerability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vulnerability"
        "404":
          description: Not found
    patch:
      operationId: updateVulnerability
      tags: [vulnerabilities]
      summary: Update vulnerability status/remediation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VulnerabilityPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vulnerability"

  # ─── Threats ─────────────────────────────────────────────────
  /threats:
    get:
      operationId: listThreats
      tags: [threats]
      summary: List active threats
      parameters:
        - name: severity
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of threats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Threat"
    post:
      operationId: createThreat
      tags: [threats]
      summary: Create threat intelligence entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreatInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Threat"

  /threats/stats:
    get:
      operationId: getThreatStats
      tags: [threats]
      summary: Get threat statistics
      responses:
        "200":
          description: Threat stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreatStats"

  /threats/{id}:
    get:
      operationId: getThreat
      tags: [threats]
      summary: Get threat by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Threat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Threat"
        "404":
          description: Not found
    patch:
      operationId: updateThreat
      tags: [threats]
      summary: Update threat status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreatPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Threat"

  # ─── Incidents ───────────────────────────────────────────────
  /incidents:
    get:
      operationId: listIncidents
      tags: [incidents]
      summary: List incidents
      parameters:
        - name: severity
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"
    post:
      operationId: createIncident
      tags: [incidents]
      summary: Create an incident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"

  /incidents/{id}:
    get:
      operationId: getIncident
      tags: [incidents]
      summary: Get incident by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "404":
          description: Not found
    patch:
      operationId: updateIncident
      tags: [incidents]
      summary: Update incident
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"

  # ─── AI Agents ───────────────────────────────────────────────
  /ai/agents:
    get:
      operationId: listAiAgents
      tags: [ai]
      summary: List AI agents and their status
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiAgent"

  /ai/query:
    post:
      operationId: queryAiAgent
      tags: [ai]
      summary: Query an AI agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiQueryInput"
      responses:
        "200":
          description: Agent response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiQueryResponse"

  /ai/interactions:
    get:
      operationId: listAiInteractions
      tags: [ai]
      summary: List recent AI agent interactions
      parameters:
        - name: agentType
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: number }
      responses:
        "200":
          description: List of interactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiInteraction"

  # ─── Workflows ───────────────────────────────────────────────
  /workflows:
    get:
      operationId: listWorkflows
      tags: [workflows]
      summary: List workflows
      responses:
        "200":
          description: List of workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workflow"
    post:
      operationId: createWorkflow
      tags: [workflows]
      summary: Create a workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"

  /workflows/{id}:
    get:
      operationId: getWorkflow
      tags: [workflows]
      summary: Get workflow by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
    patch:
      operationId: updateWorkflow
      tags: [workflows]
      summary: Update workflow
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
    delete:
      operationId: deleteWorkflow
      tags: [workflows]
      summary: Delete workflow
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /workflows/{id}/execute:
    post:
      operationId: executeWorkflow
      tags: [workflows]
      summary: Execute a workflow
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Execution started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"

  /workflows/executions:
    get:
      operationId: listWorkflowExecutions
      tags: [workflows]
      summary: List workflow executions
      responses:
        "200":
          description: List of executions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowExecution"

  # ─── Compliance ──────────────────────────────────────────────
  /compliance/frameworks:
    get:
      operationId: listComplianceFrameworks
      tags: [compliance]
      summary: List compliance frameworks
      responses:
        "200":
          description: List of frameworks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComplianceFramework"

  /compliance/controls:
    get:
      operationId: listComplianceControls
      tags: [compliance]
      summary: List compliance controls
      parameters:
        - name: framework
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of controls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComplianceControl"
    post:
      operationId: createComplianceControl
      tags: [compliance]
      summary: Create a compliance control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplianceControlInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceControl"

  /compliance/controls/{id}:
    patch:
      operationId: updateComplianceControl
      tags: [compliance]
      summary: Update compliance control
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplianceControlPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceControl"

  /compliance/summary:
    get:
      operationId: getComplianceSummary
      tags: [compliance]
      summary: Get compliance summary across frameworks
      responses:
        "200":
          description: Compliance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceSummary"

  # ─── Reports ─────────────────────────────────────────────────
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List reports
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: generateReport
      tags: [reports]
      summary: Generate a new report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get report by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  # ─── Audit Logs ──────────────────────────────────────────────
  /audit/logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: Get audit logs
      parameters:
        - name: action
          in: query
          schema: { type: string }
        - name: resourceType
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: number }
      responses:
        "200":
          description: List of audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  # ─── System ──────────────────────────────────────────────────
  /system/metrics:
    get:
      operationId: getSystemMetrics
      tags: [system]
      summary: Get system-wide security metrics
      responses:
        "200":
          description: System metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemMetrics"

  /system/status:
    get:
      operationId: getSystemStatus
      tags: [system]
      summary: Get system service status
      responses:
        "200":
          description: System status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── Dashboard ─────────────────────────────────────────────
    DashboardSummary:
      type: object
      required:
        - securityScore
        - assetsTotal
        - vulnerabilities
        - threats
        - incidents
        - complianceAverage
        - meanTimeToDetect
        - meanTimeToRespond
      properties:
        securityScore:
          type: number
        assetsTotal:
          type: number
        vulnerabilities:
          type: object
          required: [critical, high, medium, low, total]
          properties:
            critical: { type: number }
            high: { type: number }
            medium: { type: number }
            low: { type: number }
            total: { type: number }
        threats:
          type: object
          required: [active, investigating, resolved]
          properties:
            active: { type: number }
            investigating: { type: number }
            resolved: { type: number }
        incidents:
          type: object
          required: [open, inProgress, closed]
          properties:
            open: { type: number }
            inProgress: { type: number }
            closed: { type: number }
        complianceAverage:
          type: number
        meanTimeToDetect:
          type: string
        meanTimeToRespond:
          type: string

    ActivityItem:
      type: object
      required: [id, type, title, severity, timestamp]
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        severity:
          type: string
        timestamp:
          type: string
        resourceId:
          type: ["string", "null"]

    # ─── Assets ────────────────────────────────────────────────
    Asset:
      type: object
      required: [id, name, type, criticality, status, discoveredAt, lastSeen]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        ipAddresses:
          type: array
          items: { type: string }
        hostname:
          type: ["string", "null"]
        os:
          type: ["string", "null"]
        version:
          type: ["string", "null"]
        criticality:
          type: number
        ownerId:
          type: ["string", "null"]
        metadata:
          type: ["object", "null"]
          additionalProperties: true
        discoveredAt:
          type: string
        lastSeen:
          type: string
        status:
          type: string

    AssetInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        ipAddresses:
          type: array
          items: { type: string }
        hostname:
          type: string
        os:
          type: string
        version:
          type: string
        criticality:
          type: number
        ownerId:
          type: string
        metadata:
          type: object
          additionalProperties: true

    AssetPatch:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        ipAddresses:
          type: array
          items: { type: string }
        hostname:
          type: string
        os:
          type: string
        version:
          type: string
        criticality:
          type: number
        status:
          type: string
        ownerId:
          type: string

    AssetStats:
      type: object
      required: [byType, byCriticality, byStatus]
      properties:
        byType:
          type: array
          items:
            type: object
            required: [type, count]
            properties:
              type: { type: string }
              count: { type: number }
        byCriticality:
          type: array
          items:
            type: object
            required: [level, count]
            properties:
              level: { type: number }
              count: { type: number }
        byStatus:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status: { type: string }
              count: { type: number }

    # ─── Vulnerabilities ───────────────────────────────────────
    Vulnerability:
      type: object
      required: [id, title, severity, status, discoveredAt, updatedAt]
      properties:
        id:
          type: string
        assetId:
          type: ["string", "null"]
        cveId:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: ["string", "null"]
        severity:
          type: string
        cvssScore:
          type: ["number", "null"]
        cvssVector:
          type: ["string", "null"]
        status:
          type: string
        remediation:
          type: ["string", "null"]
        remediationDays:
          type: ["number", "null"]
        discoveredAt:
          type: string
        updatedAt:
          type: string
        resolvedAt:
          type: ["string", "null"]

    VulnerabilityInput:
      type: object
      required: [title, severity]
      properties:
        assetId:
          type: string
        cveId:
          type: string
        title:
          type: string
        description:
          type: string
        severity:
          type: string
        cvssScore:
          type: number
        cvssVector:
          type: string
        remediation:
          type: string
        remediationDays:
          type: number

    VulnerabilityPatch:
      type: object
      properties:
        status:
          type: string
        remediation:
          type: string
        remediationDays:
          type: number

    VulnerabilityStats:
      type: object
      required: [bySeverity, byStatus, trend]
      properties:
        bySeverity:
          type: array
          items:
            type: object
            required: [severity, count]
            properties:
              severity: { type: string }
              count: { type: number }
        byStatus:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status: { type: string }
              count: { type: number }
        trend:
          type: array
          items:
            type: object
            required: [date, count]
            properties:
              date: { type: string }
              count: { type: number }

    # ─── Threats ───────────────────────────────────────────────
    Threat:
      type: object
      required: [id, threatId, type, severity, status, createdAt]
      properties:
        id:
          type: string
        threatId:
          type: string
        type:
          type: string
        severity:
          type: string
        sourceIp:
          type: ["string", "null"]
        targetAssetId:
